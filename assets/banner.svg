<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Project Rescue - lose the folder, keep the project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/><stop offset="0.55" stop-color="#1a0d12"/><stop offset="1" stop-color="#2a0f0a"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d00"/><stop offset="0.5" stop-color="#ff9100"/><stop offset="1" stop-color="#ffe082"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb74d"/><stop offset="1" stop-color="#ff5722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ff6d00" stop-opacity="0.45"/><stop offset="1" stop-color="#ff6d00" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <g opacity="0.35" stroke="#ff9100" stroke-width="1">
    <path d="M0 300 H1200 M0 330 H1200" opacity="0.2"/>
  </g>
  <!-- project-rescue: wings + flame body -->
  <g transform="translate(120 40)">
    <path d="M110 250 C60 210 20 150 0 70 C50 100 85 100 110 70 C105 130 125 190 110 250Z" fill="url(#fire)" opacity="0.95"/>
    <path d="M110 250 C160 210 200 150 220 70 C170 100 135 100 110 70 C115 130 95 190 110 250Z" fill="url(#fire)" opacity="0.95"/>
    <path d="M110 255 C70 215 80 160 110 105 C140 160 150 215 110 255Z" fill="#fff3c4"/>
    <path d="M110 105 C100 70 112 40 110 10 C128 40 130 75 110 105Z" fill="url(#fire)"/>
    <circle cx="110" cy="150" r="46" fill="#ff6d00" opacity="0.25" filter="url(#blur)"/>
  </g>
  <text x="400" y="170" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="2">PROJECT RESCUE</text>
  <text x="404" y="226" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#ffe0b2" letter-spacing="1">Lose the folder. Keep the project.</text>
  <text x="404" y="280" font-family="Consolas, Menlo, monospace" font-size="22" fill="#ff8a65">live backup  •  private GitHub copy  •  one-sentence rescue</text>
</svg>
